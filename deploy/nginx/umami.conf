limit_req_zone $binary_remote_addr zone=umami_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=umami_collect:20m rate=20r/s;

upstream umami_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

map $http_origin $umami_cors_origin {
    default "";
    "https://analytics.example.com" $http_origin;
    "https://admin.example.com" $http_origin;
}

server {
    listen 80;
    server_name analytics.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name analytics.example.com;

    ssl_certificate     /etc/nginx/tls/analytics.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/analytics.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;

    location = /api/auth/login {
        limit_req zone=umami_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://umami_app;
        include /etc/nginx/snippets/umami-proxy.conf;
    }

    location ~ ^/api/(send|batch)$ {
        limit_req zone=umami_collect burst=40 nodelay;
        limit_req_status 429;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        add_header Access-Control-Allow-Origin "*" always;
        proxy_pass http://umami_app;
        include /etc/nginx/snippets/umami-proxy.conf;
    }

    location /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $umami_cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Vary Origin always;
            return 204;
        }

        add_header Access-Control-Allow-Origin $umami_cors_origin always;
        add_header Vary Origin always;
        proxy_pass http://umami_app;
        include /etc/nginx/snippets/umami-proxy.conf;
    }

    location /q/ {
        proxy_pass http://umami_app;
        include /etc/nginx/snippets/umami-proxy.conf;
    }

    location /p/ {
        proxy_pass http://umami_app;
        include /etc/nginx/snippets/umami-proxy.conf;
    }

    location / {
        proxy_pass http://umami_app;
        include /etc/nginx/snippets/umami-proxy.conf;
    }
}
